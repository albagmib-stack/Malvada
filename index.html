<style>
  :root{
    /* Paleta tomada del logo: azul petróleo #1B5A7D y dorado arena #C7A877 */
    --bg:#EEF2F4;
    --card:#FFFFFF;
    --card-shadow:0 1px 2px rgba(18,56,76,0.06), 0 2px 10px rgba(18,56,76,0.06);
    --ink:#12384C;
    --ink-soft:#7B93A0;
    --line:#DCE6EB;
    --field-bg:#F5F8F9;
    --blue:#1B5A7D;
    --blue-soft:#E2ECF1;
    --red:#B24A3C;
    --red-soft:#F8E7E3;
    --green:#1C7A62;
    --green-soft:#E0F0EB;
    --purple:#3E5A66;
    --purple-soft:#E4EBEE;
    --cash:#9A7639;
    --cash-soft:#F5EBDA;
    --gray-pill:#E6EDF0;
    --gold:#C7A877;
    --gold-soft:#F5EBDA;
    --gold-ink:#8A6A2F;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  }

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--font);}
  body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;}
  #root{width:100%;max-width:480px;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--bg);position:relative;}

  /* Header */
  .page-header{position:sticky;top:0;z-index:20;background:var(--bg);padding:16px 18px 10px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .page-header .brand{display:flex;flex-direction:column;gap:3px;min-width:0;}
  .page-header img.logo{width:190px;max-width:58vw;height:auto;display:block;}
  .page-header h1{font-size:11px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:0.14em;color:var(--ink-soft);padding-left:2px;}
  .page-header .today{flex:0 0 auto;text-align:right;font-size:11px;font-weight:800;color:var(--gold-ink);background:var(--gold-soft);padding:7px 11px;border-radius:999px;white-space:nowrap;}

  main{flex:1;padding:2px 16px 104px 16px;}
  h2.section-title{font-size:12.5px;font-weight:800;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-soft);margin:22px 2px 10px 2px;}
  h2.section-title:first-child{margin-top:2px;}

  .card{background:var(--card);border-radius:18px;padding:15px 16px;box-shadow:var(--card-shadow);margin-bottom:14px;}

  /* Filter bar */
  .pill-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:9px;}
  .pill-btn{padding:8px 13px;border-radius:999px;border:none;background:var(--gray-pill);color:#4C6673;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;}
  .pill-btn.active{background:var(--ink);color:#fff;}
  .date-input-row{display:flex;gap:8px;margin-bottom:9px;}
  .date-input-row input{flex:1;min-width:0;padding:10px 11px;border-radius:12px;border:1px solid var(--line);background:var(--field-bg);color:var(--ink);font-size:16px;font-weight:600;font-family:inherit;}
  .filter-label-pill{display:inline-flex;align-items:center;gap:6px;background:var(--purple-soft);color:var(--purple);font-weight:800;font-size:12.5px;padding:8px 14px;border-radius:999px;margin-bottom:14px;}

  /* Stat grid */
  .stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px;}
  .stat-card{border-radius:16px;padding:12px 10px;}
  .stat-card .lbl{font-size:11px;font-weight:700;margin-bottom:4px;color:var(--ink-soft);}
  .stat-card .val{font-size:16px;font-weight:800;line-height:1.15;}
  .stat-card.income{background:var(--blue-soft);} .stat-card.income .val{color:var(--blue);}
  .stat-card.expense{background:var(--red-soft);} .stat-card.expense .val{color:var(--red);}
  .stat-card.balance{background:var(--green-soft);} .stat-card.balance .val{color:var(--green);}
  .stat-card.balance.neg{background:var(--red-soft);} .stat-card.balance.neg .val{color:var(--red);}

  /* Generic list rows inside a card */
  .list-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 1px;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row .name{font-weight:600;font-size:13.5px;}
  .list-row .amt{font-weight:800;font-size:14px;white-space:nowrap;}
  .list-row .amt.income{color:var(--blue);}
  .list-row .amt.expense{color:var(--red);}

  /* Tiles */
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:6px;}
  .tile{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--card-shadow);cursor:pointer;border:none;text-align:left;font-family:inherit;}
  .tile .t-name{font-weight:700;font-size:13.5px;margin-bottom:4px;color:var(--ink);}
  .tile .t-sum{font-weight:700;font-size:12.5px;}
  .tile.income .t-sum{color:var(--blue);}
  .tile.expense .t-sum{color:var(--red);}
  .tile.cash{background:var(--cash-soft);grid-column:1 / -1;display:flex;align-items:center;justify-content:space-between;}
  .tile.cash .t-name{color:var(--cash);}
  .tile.cash .t-sum{color:var(--cash);}

  .add-cat-btn{width:100%;padding:13px;border-radius:14px;border:1.5px dashed var(--line);background:transparent;color:var(--ink-soft);font-weight:700;font-size:13px;cursor:pointer;margin-top:2px;font-family:inherit;}

  /* Entry rows */
  .entry-row{display:flex;align-items:center;gap:10px;padding:10px 1px;border-bottom:1px solid var(--line);}
  .entry-row:last-child{border-bottom:none;}
  .entry-row .badge{width:8px;height:8px;border-radius:50%;flex:0 0 auto;}
  .recon-check{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:#fff;flex:0 0 auto;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;color:#fff;padding:0;}
  .recon-check.done{background:var(--green);border-color:var(--green);}
  .pending-toggle{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .pending-toggle .pill-btn{margin-bottom:0;}
  .pending-count{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
  .entry-row.income .badge{background:var(--blue);}
  .entry-row.expense .badge{background:var(--red);}
  .entry-row .meta{flex:1;min-width:0;}
  .entry-row .meta .main{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .entry-row .meta .sub{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:1px;}
  .entry-row .amt{font-weight:800;font-size:14px;white-space:nowrap;}
  .entry-row.income .amt{color:var(--blue);}
  .entry-row.expense .amt{color:var(--red);}
  .entry-row .del{background:none;border:none;color:#B7C8D0;font-size:16px;cursor:pointer;padding:2px 4px;}
  .entry-row .del:active{color:var(--red);}

  input[type=date]{-webkit-appearance:none;appearance:none;min-height:44px;line-height:1.2;}

  /* Forms */
  .form-card{background:var(--card);border-radius:18px;padding:16px;box-shadow:var(--card-shadow);margin-bottom:16px;}
  .back-btn{background:none;border:none;color:var(--ink-soft);font-weight:800;font-size:13px;padding:0 0 12px 0;cursor:pointer;font-family:inherit;}
  .field{margin-bottom:11px;}
  .field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:5px;}
  .field input{width:100%;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--field-bg);font-size:16px;font-weight:600;color:var(--ink);font-family:inherit;}
  .field input::placeholder{color:#9DB2BC;font-weight:500;}
  .field-row{display:flex;gap:8px;}
  .field-row .field{flex:1;min-width:0;}
  .method-badge{display:inline-flex;align-items:center;gap:6px;background:var(--blue-soft);color:var(--blue);font-weight:800;font-size:13.5px;padding:8px 14px;border-radius:999px;margin-bottom:14px;}
  .date-tap{cursor:pointer;border:1.5px solid var(--line) !important;font-size:16px !important;padding:12px !important;}
  .date-tap:active{border-color:var(--ink) !important;}
  .submit-btn{width:100%;padding:13px;border-radius:14px;border:none;font-weight:800;font-size:14.5px;cursor:pointer;color:#fff;font-family:inherit;margin-top:2px;}
  .submit-btn.income{background:var(--blue);}
  .submit-btn.expense{background:var(--red);}

  /* Trend */
  .trend{display:flex;align-items:flex-end;gap:6px;height:80px;padding:6px 2px 0 2px;}
  .trend .day{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .trend .bars{display:flex;gap:2px;align-items:flex-end;height:56px;}
  .trend .bar{flex:1;min-width:2px;max-width:8px;border-radius:3px 3px 0 0;}
  .trend .bars{width:100%;justify-content:center;}
  .trend .bar.in{background:var(--blue);}
  .trend .bar.out{background:var(--red);}
  .trend .lbl{font-size:10px;font-weight:800;color:var(--ink-soft);}

  /* Buscador de día */
  .search-day{background:var(--card);border-radius:16px;padding:11px 13px;box-shadow:var(--card-shadow);margin-bottom:10px;}
  .search-day label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:0.03em;color:var(--ink-soft);margin-bottom:6px;}
  .search-day .row{display:flex;gap:8px;align-items:center;}
  .search-day input{flex:1;min-width:0;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--field-bg);color:var(--ink);font-size:16px;font-weight:700;font-family:inherit;min-height:44px;}
  .search-day .clear{flex:0 0 auto;background:var(--gray-pill);border:none;border-radius:12px;padding:12px 14px;font-weight:800;font-size:13px;color:#4C6673;font-family:inherit;cursor:pointer;}

  /* Facturación por días */
  .day-block{border-bottom:1px solid var(--line);padding:11px 1px 12px 1px;}
  .day-block:last-child{border-bottom:none;}
  .day-head{display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;}
  .day-head .d{font-size:13.5px;font-weight:800;}
  .day-head .d .arrow{color:#B7C8D0;font-weight:800;margin-left:4px;}
  .day-head .tot{font-size:15px;font-weight:800;color:var(--blue);white-space:nowrap;}
  .chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
  .chip{background:var(--blue-soft);color:var(--blue);font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:999px;}
  .chip.out{background:var(--red-soft);color:var(--red);}
  .chip.cash{background:var(--cash-soft);color:var(--cash);}
  .day-sub{font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-top:7px;}

  /* Grupos pendientes de conciliar */
  .group-row{display:flex;align-items:center;gap:10px;padding:12px 1px;border-bottom:1px solid var(--line);}
  .group-row:last-child{border-bottom:none;}
  .group-row .meta{flex:1;min-width:0;cursor:pointer;}
  .group-row .meta .main{font-size:13.5px;font-weight:800;}
  .group-row .meta .sub{font-size:11px;color:var(--ink-soft);font-weight:700;margin-top:2px;}
  .group-row .amt{font-weight:800;font-size:15px;white-space:nowrap;}
  .group-detail{padding:0 0 8px 32px;border-bottom:1px solid var(--line);}
  .group-detail:last-child{border-bottom:none;}

  .empty-note{color:var(--ink-soft);font-size:13px;padding:16px 2px;text-align:center;font-weight:600;}

  .storage-note{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--card-shadow);margin:6px 0 24px 0;font-size:12px;font-weight:700;color:var(--ink-soft);}
  .storage-note .mini{background:var(--gray-pill);border:none;border-radius:999px;padding:8px 12px;font-weight:800;font-size:12px;color:#4C6673;font-family:inherit;cursor:pointer;}

  .save-banner{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--gold-soft);border:1px solid #E4CFA6;color:var(--gold-ink);font-weight:700;font-size:12.5px;padding:10px 12px;border-radius:14px;margin-bottom:14px;}
  .save-banner button{flex:0 0 auto;background:var(--gold-ink);color:#fff;border:none;border-radius:999px;padding:7px 12px;font-weight:800;font-size:12px;cursor:pointer;font-family:inherit;}

  /* Bottom nav */
  .bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0)) 6px;z-index:30;}
  .nav-btn{flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:#9DB2BC;font-weight:800;font-size:11px;cursor:pointer;font-family:inherit;}
  .nav-btn .nav-icon{font-size:20px;}
  .nav-btn.active{color:var(--ink);}

  .toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-weight:700;font-size:12.5px;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:50;}
  .toast.show{opacity:1;}

  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }
</style>
</head>

<script>
/* ---------- estado ---------- */
const DEFAULT_CATEGORIES = ["Proveedores","Sueldos","Seguridad Social","Suministros","Otros"];
const INCOME_METHODS = ["Efectivo","Tarjeta","Just Eat","Glovo","Uber Eats","LastApp"];
const STORAGE_KEY = "caja-data-v1";

let state = { incomeEntries: [], expenseEntries: [], expenseCategories: [...DEFAULT_CATEGORIES], tombstones: [], pendingIds: [], lastPull: null, savedAt: 0 };
let ui = {
  tab: "resumen",
  gastoView: "list",
  selectedCategory: null,
  resumenFilter: { mode: "hoy" },
  incomeFilter: { mode: "hoy" },
  expenseFilter: { mode: "hoy" },
  cashFilter: { mode: "todo" },
  expenseCash: false,
  trendRange: 7,
  openDays: {},
  openGroups: {},
  incomeOnlyPending: false,
  expenseOnlyPending: false,
  cashOnlyPending: false
};

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return toLocalISO(new Date()); }
function toLocalISO(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtMoney(n){
  return (Math.round(n*100)/100).toLocaleString('es-ES',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function fmtDateShort(iso){
  const [y,m,d]=iso.split('-');
  return `${d}/${m}`;
}
const DOW_SHORT = ['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
function dowShort(iso){ return DOW_SHORT[new Date(iso+'T00:00:00').getDay()]; }
function fmtDateDow(iso){ return `${dowShort(iso)} ${fmtDateShort(iso)}`; }
const MONTH_NAMES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
function monthKey(iso){ return iso.slice(0,7); }
function monthLabel(key){ const [y,m] = key.split('-'); return `${MONTH_NAMES[Number(m)-1]} ${y}`; }
function eachDay(range){
  const out = [];
  const [a,b] = range;
  let d = new Date(a + 'T00:00:00');
  const end = new Date(b + 'T00:00:00');
  let guard = 0;
  while(d <= end && guard++ < 400){ out.push(toLocalISO(d)); d.setDate(d.getDate()+1); }
  return out;
}

/* ---------- almacenamiento y sincronización ----------
   Tres capas, de más segura a menos:
   1) Supabase  -> los datos viven en el servidor, iguales en todos los aparatos
   2) El propio dispositivo (localStorage) -> caché para trabajar sin cobertura
   3) window.storage -> respaldo cuando la app corre dentro de Claude
   Nunca se pierde nada: primero se apunta en el dispositivo y luego se sube.  */

const CFG_KEY = "caja-supabase-cfg";
const SESSION_KEY = "caja-supabase-session";

let storageMode = 'local';   // 'nube' | 'local' | 'memoria'
let memoryOnly = null;
let cfg = null;              // { url, key }
let session = null;          // { access_token, refresh_token, expires_at, email }
let sync = { estado: 'off', mensaje: 'Sin configurar', ultima: null, subiendo: false };

/* --- utilidades de almacén local --- */
function cloudAvailable(){
  try{ return !!(window.storage && typeof window.storage.get === 'function' && typeof window.storage.set === 'function'); }
  catch(e){ return false; }
}
function localAvailable(){
  try{ const k='__test__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }
  catch(e){ return false; }
}
function lsGet(k){ try{ return localAvailable() ? localStorage.getItem(k) : null; }catch(e){ return null; } }
function lsSet(k,v){ try{ if(localAvailable()) localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ if(localAvailable()) localStorage.removeItem(k); }catch(e){} }

function normalize(parsed){
  if(!parsed || typeof parsed !== 'object') return null;
  return {
    incomeEntries: parsed.incomeEntries || [],
    expenseEntries: parsed.expenseEntries || [],
    expenseCategories: (parsed.expenseCategories && parsed.expenseCategories.length) ? parsed.expenseCategories : [...DEFAULT_CATEGORIES],
    tombstones: parsed.tombstones || [],
    pendingIds: parsed.pendingIds || [],
    lastPull: parsed.lastPull || null,
    savedAt: parsed.savedAt || 0
  };
}

async function readCloud(){
  if(!cloudAvailable()) return null;
  try{
    const res = await window.storage.get(STORAGE_KEY, false);
    if(res && res.value) return normalize(JSON.parse(res.value));
    return null;
  }catch(e){ return null; }
}
function readLocal(){
  try{
    if(!localAvailable()) return memoryOnly ? normalize(memoryOnly) : null;
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? normalize(JSON.parse(raw)) : null;
  }catch(e){ return null; }
}

function writeLocal(){
  const json = JSON.stringify(state);
  if(localAvailable()){ try{ localStorage.setItem(STORAGE_KEY, json); }catch(e){ memoryOnly = JSON.parse(json); return false; } }
  else memoryOnly = JSON.parse(json);
  if(cloudAvailable()){ try{ window.storage.set(STORAGE_KEY, json, false); }catch(e){} }
  return localAvailable();
}

/* --- guardar: dispositivo primero, servidor después --- */
async function saveState(){
  state.savedAt = Date.now();
  const ok = writeLocal();
  storageMode = ok ? 'local' : (cloudAvailable() ? 'nube' : 'memoria');
  if(sbReady()) syncNow(true);
  return ok || cloudAvailable();
}

function markPending(id){
  if(state.pendingIds.indexOf(id) === -1) state.pendingIds.push(id);
}
function touch(entry){
  entry.updatedAt = new Date().toISOString();
  markPending(entry.id);
  return entry;
}
function addTombstone(id){
  state.tombstones = state.tombstones.filter(t=>t.id!==id);
  state.tombstones.push({ id, updatedAt: new Date().toISOString() });
  markPending(id);
}

/* --- configuración de Supabase --- */
function loadCfg(){
  try{ cfg = JSON.parse(lsGet(CFG_KEY) || 'null'); }catch(e){ cfg = null; }
  try{ session = JSON.parse(lsGet(SESSION_KEY) || 'null'); }catch(e){ session = null; }
  if(cfg && cfg.url) cfg.url = cfg.url.replace(/\/+$/,'');
}
function saveCfg(url, key){
  cfg = { url: String(url||'').trim().replace(/\/+$/,''), key: String(key||'').trim() };
  lsSet(CFG_KEY, JSON.stringify(cfg));
}
function forgetCfg(){ cfg = null; session = null; lsDel(CFG_KEY); lsDel(SESSION_KEY); sync = { estado:'off', mensaje:'Sin configurar', ultima:null, subiendo:false }; }
function sbConfigured(){ return !!(cfg && cfg.url && cfg.key); }
function sbReady(){ return sbConfigured() && !!(session && session.access_token); }

/* --- sesión --- */
async function sbLogin(email, password){
  if(!sbConfigured()) throw new Error('Falta la dirección o la clave de Supabase');
  const res = await fetch(cfg.url + '/auth/v1/token?grant_type=password', {
    method:'POST',
    headers:{ 'Content-Type':'application/json', apikey: cfg.key },
    body: JSON.stringify({ email: String(email).trim(), password })
  });
  const data = await res.json();
  if(!res.ok || !data.access_token) throw new Error(data.error_description || data.msg || data.message || 'No se pudo entrar');
  session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in||3600)*1000, email: (data.user && data.user.email) || email };
  lsSet(SESSION_KEY, JSON.stringify(session));
  // La primera vez, sube todo lo que ya había apuntado en este aparato
  state.incomeEntries.concat(state.expenseEntries).forEach(e=>markPending(e.id));
  await saveState();
  return session;
}
async function sbRefresh(){
  if(!session || !session.refresh_token) return false;
  try{
    const res = await fetch(cfg.url + '/auth/v1/token?grant_type=refresh_token', {
      method:'POST', headers:{ 'Content-Type':'application/json', apikey: cfg.key },
      body: JSON.stringify({ refresh_token: session.refresh_token })
    });
    const data = await res.json();
    if(!res.ok || !data.access_token) return false;
    session = { access_token:data.access_token, refresh_token:data.refresh_token, expires_at: Date.now() + (data.expires_in||3600)*1000, email: session.email };
    lsSet(SESSION_KEY, JSON.stringify(session));
    return true;
  }catch(e){ return false; }
}
function sbLogout(){ session = null; lsDel(SESSION_KEY); sync = { estado:'off', mensaje:'Sesión cerrada', ultima:null, subiendo:false }; }

async function sbFetch(path, opts, reintento){
  const o = opts || {};
  const headers = Object.assign({
    apikey: cfg.key,
    Authorization: 'Bearer ' + session.access_token,
    'Content-Type': 'application/json'
  }, o.headers || {});
  const res = await fetch(cfg.url + '/rest/v1/' + path, Object.assign({}, o, { headers }));
  if(res.status === 401 && !reintento){
    if(await sbRefresh()) return sbFetch(path, opts, true);
  }
  return res;
}

/* --- conversión entre la app y las tablas --- */
function toRow(e, tipo){
  return {
    id: e.id,
    tipo,
    fecha: e.date,
    importe: Number(e.amount),
    metodo: tipo === 'ingreso' ? (e.method || null) : null,
    categoria: tipo === 'gasto' ? (e.category || null) : null,
    subcategoria: tipo === 'gasto' ? (e.subcategory || null) : null,
    nota: e.note || null,
    efectivo: tipo === 'gasto' ? !!e.cash : false,
    conciliado: !!e.reconciled,
    borrado: false,
    actualizado: e.updatedAt || new Date().toISOString()
  };
}
function fromRow(r){
  const base = { id:r.id, date:r.fecha, amount:Number(r.importe), note:r.nota || '', reconciled:!!r.conciliado, updatedAt:r.actualizado };
  if(r.tipo === 'ingreso') return Object.assign(base, { method: r.metodo || 'Efectivo' });
  return Object.assign(base, { category: r.categoria || 'Otros', subcategory: r.subcategoria || '', cash: !!r.efectivo });
}
function findEntry(id){
  let e = state.incomeEntries.find(x=>x.id===id);
  if(e) return { entry:e, tipo:'ingreso' };
  e = state.expenseEntries.find(x=>x.id===id);
  if(e) return { entry:e, tipo:'gasto' };
  return null;
}

/* Repinta sin molestar: si está escribiendo en un campo, solo actualiza la
   chapa de estado de la cabecera y deja el formulario en paz.                */
function syncRender(forzar){
  const pill = document.getElementById('todayPill');
  if(pill) pill.textContent = syncPillText();
  const ae = document.activeElement;
  if(!forzar && ae && (ae.tagName === 'INPUT' || ae.tagName === 'TEXTAREA')) return;
  render();
}

/* --- sincronizar --- */
async function syncNow(silencioso){
  if(!sbReady()){ sync.estado = sbConfigured() ? 'sesion' : 'off'; sync.mensaje = sbConfigured() ? 'Falta entrar con tu correo' : 'Sin configurar'; if(!silencioso) syncRender(true); return false; }
  if(sync.subiendo) return false;
  sync.subiendo = true;
  if(!silencioso){ sync.mensaje = 'Sincronizando…'; syncRender(true); }
  try{
    /* 1. subir lo pendiente */
    if(state.pendingIds.length){
      const filas = [];
      state.pendingIds.forEach(id=>{
        const t = state.tombstones.find(x=>x.id===id);
        const hit = findEntry(id);
        if(hit) filas.push(toRow(hit.entry, hit.tipo));
        else if(t) filas.push({ id, tipo:'ingreso', fecha: todayISO(), importe: 0, borrado: true, actualizado: t.updatedAt });
      });
      if(filas.length){
        const res = await sbFetch('caja_movimientos', {
          method:'POST',
          headers:{ Prefer:'resolution=merge-duplicates,return=minimal' },
          body: JSON.stringify(filas)
        });
        if(!res.ok) throw new Error('No se pudieron subir los movimientos (' + res.status + ')');
      }
      state.pendingIds = [];
    }
    /* categorías */
    const cats = state.expenseCategories.map(n=>({ nombre:n, actualizado:new Date().toISOString() }));
    if(cats.length){
      await sbFetch('caja_categorias', { method:'POST', headers:{ Prefer:'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify(cats) });
    }

    /* 2. bajar lo que hayan apuntado otros aparatos */
    const desde = state.lastPull ? new Date(new Date(state.lastPull).getTime() - 60000).toISOString() : '1970-01-01T00:00:00Z';
    const res2 = await sbFetch('caja_movimientos?select=*&actualizado=gt.' + encodeURIComponent(desde) + '&order=actualizado.asc', { method:'GET' });
    if(!res2.ok) throw new Error('No se pudieron bajar los movimientos (' + res2.status + ')');
    const filas = await res2.json();
    filas.forEach(r=>aplicarFilaRemota(r));

    const res3 = await sbFetch('caja_categorias?select=nombre', { method:'GET' });
    if(res3.ok){
      const remotas = (await res3.json()).map(c=>c.nombre);
      remotas.forEach(n=>{ if(state.expenseCategories.indexOf(n) === -1) state.expenseCategories.push(n); });
    }

    state.lastPull = new Date().toISOString();
    state.savedAt = Date.now();
    writeLocal();
    sync.estado = 'ok';
    sync.ultima = new Date();
    sync.mensaje = 'Todo sincronizado';
    sync.subiendo = false;
    syncRender(!silencioso);
    return true;
  }catch(err){
    sync.subiendo = false;
    sync.estado = 'error';
    sync.mensaje = (err && err.message) ? err.message : 'Sin conexión con el servidor';
    writeLocal();
    syncRender(!silencioso);
    return false;
  }
}

function aplicarFilaRemota(r){
  const lista = r.tipo === 'ingreso' ? 'incomeEntries' : 'expenseEntries';
  const tomb = state.tombstones.find(t=>t.id===r.id);
  if(r.borrado){
    state.incomeEntries = state.incomeEntries.filter(e=>e.id!==r.id);
    state.expenseEntries = state.expenseEntries.filter(e=>e.id!==r.id);
    if(!tomb) state.tombstones.push({ id:r.id, updatedAt:r.actualizado });
    return;
  }
  if(tomb && tomb.updatedAt >= r.actualizado) return;   // aquí se borró después
  const nueva = fromRow(r);
  const idx = state[lista].findIndex(e=>e.id===r.id);
  if(idx === -1){ state[lista].push(nueva); return; }
  const local = state[lista][idx];
  // gana el cambio más reciente
  if(!local.updatedAt || local.updatedAt <= r.actualizado) state[lista][idx] = nueva;
}

/* --- arranque --- */
async function loadState(){
  loadCfg();
  const hasCloud = cloudAvailable();
  storageMode = localAvailable() ? 'local' : (hasCloud ? 'nube' : 'memoria');

  const [nube, local] = [hasCloud ? await readCloud() : null, readLocal()];
  let chosen = null;
  if(nube && local) chosen = (local.savedAt > nube.savedAt) ? local : nube;
  else chosen = nube || local;

  if(chosen){
    state.incomeEntries = chosen.incomeEntries;
    state.expenseEntries = chosen.expenseEntries;
    state.expenseCategories = chosen.expenseCategories;
    state.tombstones = chosen.tombstones;
    state.pendingIds = chosen.pendingIds;
    state.lastPull = chosen.lastPull;
    state.savedAt = chosen.savedAt;
    writeLocal();
  }
  if(sbReady()){ sync.estado = 'pend'; sync.mensaje = 'Conectando…'; syncNow(true); }
  else if(sbConfigured()){ sync.estado = 'sesion'; sync.mensaje = 'Falta entrar con tu correo'; }
}

async function importData(){
  const text = prompt('Pega aquí el contenido de la copia de seguridad (.json):');
  if(!text) return;
  try{
    const parsed = normalize(JSON.parse(text));
    if(!parsed) throw new Error('formato no válido');

    state.expenseEntries = parsed.expenseEntries;

/* ---------- rangos de fecha ---------- */
function computeRange(filter){
  const now = new Date();
  if(filter.mode === 'todo'){ return ['0000-01-01','9999-12-31']; }
  if(filter.mode === 'ayer'){
    const y = new Date(now); y.setDate(now.getDate()-1);
    const iso = toLocalISO(y);
    return [iso, iso];
  }
  if(filter.mode === 'semana'){
    const day = now.getDay();
    const diffToMonday = day === 0 ? -6 : 1 - day;
    const monday = new Date(now); monday.setDate(now.getDate() + diffToMonday);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    return [toLocalISO(monday), toLocalISO(sunday)];
  }
  if(filter.mode === 'mes'){
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    const last = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return [toLocalISO(first), toLocalISO(last)];
  }
  if(filter.mode === 'fecha' && filter.date){
    return [filter.date, filter.date];
  }
  if(filter.mode === 'rango' && filter.from && filter.to){
    return filter.from <= filter.to ? [filter.from, filter.to] : [filter.to, filter.from];
  }
  const iso = toLocalISO(now);
  return [iso, iso];
}

function filterLabel(filter){
  const [start,end] = computeRange(filter);
  if(filter.mode==='todo') return 'Todo · desde el principio';
  if(filter.mode==='hoy') return `Hoy · ${fmtDateDow(start)}`;
  if(filter.mode==='ayer') return `Ayer · ${fmtDateDow(start)}`;
  if(filter.mode==='semana') return `Esta semana · ${fmtDateDow(start)} – ${fmtDateDow(end)}`;
  if(filter.mode==='mes') return `Este mes · ${fmtDateDow(start)} – ${fmtDateDow(end)}`;
  if(filter.mode==='fecha' && filter.date) return fmtDateDow(start);
  if(filter.mode==='rango' && filter.from && filter.to) return `${fmtDateDow(start)} – ${fmtDateDow(end)}`;
  return `Hoy · ${fmtDateDow(start)}`;
}

function renderFilterBar(filterKey){
  const f = ui[filterKey];
  const modes = [['hoy','Hoy'],['ayer','Ayer'],['semana','Semana'],['mes','Mes'],['todo','Todo']];
  const showRange = f.mode === 'rango';
  return `
    <div class="pill-row">
      ${modes.map(([m,l])=>`<button class="pill-btn ${f.mode===m?'active':''}" data-action="filter-mode" data-key="${filterKey}" data-mode="${m}">${l}</button>`).join('')}
      <button class="pill-btn ${showRange?'active':''}" data-action="filter-range-toggle" data-key="${filterKey}">↔ Rango</button>
    </div>
    <div class="search-day">
      <label>🔍 Buscar un día concreto</label>
      <div class="row">
        <input type="date" data-role="filter-date" data-key="${filterKey}" value="${f.mode==='fecha' && f.date ? f.date : ''}">
        ${f.mode==='fecha' ? `<button class="clear" data-action="filter-mode" data-key="${filterKey}" data-mode="hoy">✕</button>` : ''}
      </div>
    </div>
    ${showRange ? `
    <div class="date-input-row">
      <input type="date" data-role="filter-from" data-key="${filterKey}" value="${f.from||''}">
      <input type="date" data-role="filter-to" data-key="${filterKey}" value="${f.to||''}">
    </div>` : ''}
    <div class="filter-label-pill">📅 ${filterLabel(f)}</div>
  `;
}

function inRange(dateStr, range){ return dateStr >= range[0] && dateStr <= range[1]; }
function sumEntries(list, range){ return list.filter(e=>inRange(e.date, range)).reduce((a,e)=>a+Number(e.amount),0); }

// Si el buscador está fijado en un día concreto (hoy / ayer / una fecha exacta),
// usa esa fecha por defecto al abrir el formulario, para no tener que cambiarla dos veces.
function defaultEntryDate(filter){
  if(filter.mode === 'hoy' || filter.mode === 'ayer' || filter.mode === 'fecha'){
    return computeRange(filter)[0];
  }
  return todayISO();
}
function groupSum(list, range, keyFn){
  const map = {};
  list.filter(e=>inRange(e.date,range)).forEach(e=>{
    const k = keyFn(e);
    map[k] = (map[k]||0) + Number(e.amount);
  });
  return Object.entries(map).sort((a,b)=>b[1]-a[1]);
}

/* ---------- RESUMEN ---------- */
function renderResumen(){
  const range = computeRange(ui.resumenFilter);
  const totalIn = sumEntries(state.incomeEntries, range);
  const totalOut = sumEntries(state.expenseEntries, range);
  const balance = totalIn - totalOut;

  const byMethod = groupSum(state.incomeEntries, range, e=>e.method);
  const byCat = groupSum(state.expenseEntries, range, e=>e.category);

  /* --- gráfico de tendencia, con rango elegible --- */
  const tr = ui.trendRange;
  let trendDays;
  if(tr === 'mes'){
    const now = new Date();
    const first = new Date(now.getFullYear(), now.getMonth(), 1);
    trendDays = eachDay([toLocalISO(first), todayISO()]);
  }else{
    trendDays = [];
    for(let i=Number(tr)-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); trendDays.push(toLocalISO(d)); }
  }
  const dayTotals = trendDays.map(iso=>({
    iso,
    inD: sumEntries(state.incomeEntries, [iso,iso]),
    outD: sumEntries(state.expenseEntries, [iso,iso])
  }));
  const maxVal = Math.max(1, ...dayTotals.map(d=>Math.max(d.inD,d.outD)));
  const trendIn = dayTotals.reduce((a,d)=>a+d.inD,0);
  const trendOut = dayTotals.reduce((a,d)=>a+d.outD,0);
  const many = dayTotals.length > 14;
  const trendModes = [[7,'7 días'],[14,'14 días'],[21,'21 días'],['mes','Mes']];

  /* --- facturación día a día dentro del periodo elegido --- */
  const daysInRange = eachDay(range).reverse();
  const dayRows = daysInRange.map(iso=>{
    const ins = state.incomeEntries.filter(e=>e.date===iso);
    const outs = state.expenseEntries.filter(e=>e.date===iso);
    return {
      iso,
      ins, outs,
      totIn: ins.reduce((a,e)=>a+Number(e.amount),0),
      totOut: outs.reduce((a,e)=>a+Number(e.amount),0)
    };
  }).filter(d=>d.ins.length || d.outs.length);

  const dayBreakdown = dayRows.length ? dayRows.map(d=>{
    const open = !!ui.openDays[d.iso];
    const byM = {};
    d.ins.forEach(e=>{ byM[e.method] = (byM[e.method]||0) + Number(e.amount); });
    const chips = INCOME_METHODS.filter(m=>byM[m]).map(m=>`<span class="chip">${m} ${fmtMoney(byM[m])}</span>`).join('');
    const cashOut = d.outs.filter(e=>e.cash).reduce((a,e)=>a+Number(e.amount),0);
    const extra = [];
    if(d.totOut) extra.push(`<span class="chip out">Gastos ${fmtMoney(d.totOut)}</span>`);
    if(cashOut) extra.push(`<span class="chip cash">💵 ${fmtMoney(cashOut)}</span>`);
    const detail = open ? `
      <div class="day-sub" style="margin-top:9px;">Movimientos del día</div>
      ${d.ins.map(e=>`<div class="list-row"><span class="name">${e.method}${e.note?` · ${escapeHtml(e.note)}`:''}</span><span class="amt income">+${fmtMoney(e.amount)}</span></div>`).join('')}
      ${d.outs.map(e=>`<div class="list-row"><span class="name">${e.cash?'💵 ':''}${escapeHtml(e.subcategory || e.category)}${e.note?` · ${escapeHtml(e.note)}`:''}</span><span class="amt expense">-${fmtMoney(e.amount)}</span></div>`).join('')}
    ` : '';
    return `
      <div class="day-block">
        <div class="day-head" data-action="toggle-day" data-date="${d.iso}">
          <span class="d">${fmtDateDow(d.iso)}<span class="arrow">${open?'⌄':'›'}</span></span>
          <span class="tot">${fmtMoney(d.totIn)}</span>
        </div>
        <div class="chips">${chips || '<span class="chip" style="background:var(--gray-pill);color:var(--ink-soft);">Sin cobros</span>'}${extra.join('')}</div>
        <div class="day-sub">Balance del día: ${fmtMoney(d.totIn - d.totOut)}</div>
        ${detail}
      </div>`;
  }).join('') : '<div class="empty-note">Sin movimientos en este periodo</div>';

  return `
    ${renderFilterBar('resumenFilter')}

    <div class="stat-grid">
      <div class="stat-card income"><div class="lbl">Ingresos</div><div class="val">${fmtMoney(totalIn)}</div></div>
      <div class="stat-card expense"><div class="lbl">Gastos</div><div class="val">${fmtMoney(totalOut)}</div></div>
      <div class="stat-card balance ${balance<0?'neg':''}"><div class="lbl">Balance</div><div class="val">${fmtMoney(balance)}</div></div>
    </div>

    <h2 class="section-title">Facturación por días · ${filterLabel(ui.resumenFilter)}</h2>
    <div class="card">
      ${dayBreakdown}
    </div>

    <h2 class="section-title">Tendencia</h2>
    <div class="pill-row">
      ${trendModes.map(([v,l])=>`<button class="pill-btn ${String(ui.trendRange)===String(v)?'active':''}" data-action="trend-range" data-value="${v}">${l}</button>`).join('')}
    </div>
    <div class="card">
      <div class="trend" style="gap:${many?'2px':'6px'};">
        ${dayTotals.map((d,i)=>{
          const hIn = Math.max(3, Math.round((d.inD/maxVal)*56));
          const hOut = Math.max(3, Math.round((d.outD/maxVal)*56));
          const lbl = many ? ((i % 5 === 0 || i === dayTotals.length-1) ? d.iso.slice(8) : '') : dowShort(d.iso)[0];
          return `<div class="day"><div class="bars"><div class="bar in" style="height:${hIn}px"></div><div class="bar out" style="height:${hOut}px"></div></div><div class="lbl">${lbl}</div></div>`;
        }).join('')}
      </div>
      <div class="list-row" style="border-top:1px solid var(--line);border-bottom:none;margin-top:8px;padding-top:10px;">
        <span class="name">Ingresos del periodo</span><span class="amt income">${fmtMoney(trendIn)}</span>
      </div>
      <div class="list-row"><span class="name">Gastos del periodo</span><span class="amt expense">${fmtMoney(trendOut)}</span></div>
    </div>

    <h2 class="section-title">Ingresos por método</h2>
    <div class="card">
      ${byMethod.length ? byMethod.map(([k,v])=>`<div class="list-row"><span class="name">${k}</span><span class="amt income">${fmtMoney(v)}</span></div>`).join('') : '<div class="empty-note">Sin ingresos en este periodo</div>'}
    </div>

    <h2 class="section-title">Gastos por categoría</h2>
    <div class="card">
      ${byCat.length ? byCat.map(([k,v])=>`<div class="list-row"><span class="name">${escapeHtml(k)}</span><span class="amt expense">${fmtMoney(v)}</span></div>`).join('') : '<div class="empty-note">Sin gastos en este periodo</div>'}
    </div>

    <h2 class="section-title">Datos</h2>
    <div class="storage-note">
      <span>${sbReady() ? '☁️ En el servidor · se ve en todos tus aparatos' : sbConfigured() ? '🔑 Falta entrar con tu correo' : '📱 Solo en este aparato'}</span>
      <button class="mini" data-action="goto-tab" data-tab="ajustes">Ajustes ›</button>
    </div>
  `;
}

/* ---------- pendientes de conciliar: acumulados ----------
   Todo se acumula por mes (Just Eat, Glovo, efectivo, gastos...), porque el
   banco los ingresa/cobra agrupados. La tarjeta va por día, que es como la
   liquida el banco.                                                          */
let pendingGroups = {};

function buildPendingIncomeGroups(){
  const map = {};
  state.incomeEntries.filter(e=>!e.reconciled).forEach(e=>{
    const perDay = e.method === 'Tarjeta';
    const period = perDay ? e.date : monthKey(e.date);
    const key = e.method + '|' + period;
    if(!map[key]) map[key] = { id: 'gi_' + key.replace(/[^a-zA-Z0-9]/g,'_'), title: (perDay?'💳 ':'') + e.method, sub: perDay ? fmtDateDow(period) : monthLabel(period), entries: [], total: 0, sortKey: '' };
    const g = map[key];
    g.entries.push(e); g.total += Number(e.amount);
    if(e.date > g.sortKey) g.sortKey = e.date;
  });
  return Object.values(map).sort((a,b)=> b.sortKey.localeCompare(a.sortKey));
}

function buildPendingMonthGroups(list, titlePrefix){
  const map = {};
  list.filter(e=>!e.reconciled).forEach(e=>{
    const k = monthKey(e.date);
    if(!map[k]) map[k] = { id: 'gm_' + (titlePrefix||'') .replace(/[^a-zA-Z0-9]/g,'') + '_' + k.replace('-','_'), title: (titlePrefix ? titlePrefix + ' · ' : '') + monthLabel(k), sub: '', entries: [], total: 0, sortKey: '' };
    const g = map[k];
    g.entries.push(e); g.total += Number(e.amount);
    if(e.date > g.sortKey) g.sortKey = e.date;
  });
  return Object.values(map).sort((a,b)=> b.sortKey.localeCompare(a.sortKey));
}

function renderGroupList(groups, kind, sign){
  if(!groups.length) return '<div class="empty-note">Nada pendiente de conciliar 🎉</div>';
  return groups.map(g=>{
    pendingGroups[g.id] = { ids: g.entries.map(e=>e.id), kind, label: g.title + (g.sub ? ' · ' + g.sub : ''), total: g.total, count: g.entries.length };
    const open = !!ui.openGroups[g.id];
    const detail = open ? `<div class="group-detail">${g.entries.slice().sort((a,b)=> b.date.localeCompare(a.date)).map(e=>`
        <div class="entry-row ${kind==='income'?'income':'expense'}">
          <button class="recon-check" data-action="toggle-reconciled" data-kind="${kind}" data-id="${e.id}" title="Conciliar solo este movimiento"></button>
          <div class="meta">
            <div class="main">${kind==='income' ? escapeHtml(e.method) : (e.cash?'💵 ':'') + escapeHtml(e.subcategory || e.category)}${e.note?` · ${escapeHtml(e.note)}`:''}</div>
            <div class="sub">${fmtDateDow(e.date)}</div>
          </div>
          <div class="amt">${sign}${fmtMoney(e.amount)}</div>
        </div>`).join('')}</div>` : '';
    return `
      <div class="group-row">

async function reconcileGroup(gid){
  const g = pendingGroups[gid];
  if(!g) return;
  let ok = true;
  try{ ok = window.confirm(`¿Marcar como conciliados los ${g.count} movimientos de ${g.label}?\n\nTotal: ${fmtMoney(g.total)}`); }catch(e){ ok = true; }
  if(!ok) return;
  const list = g.kind === 'income' ? state.incomeEntries : state.expenseEntries;
  list.forEach(e=>{ if(g.ids.indexOf(e.id) !== -1){ e.reconciled = true; touch(e); } });
  await saveState();
  render();
  showToast('Grupo conciliado ✓');
}

async function guardarConfig(){
  const url = document.getElementById('sbUrl').value;
  const key = document.getElementById('sbKey').value;
  if(!url || !key){ showToast('Faltan la URL o la clave'); return; }
  saveCfg(url, key);
  sync = { estado:'sesion', mensaje:'Falta entrar con tu correo', ultima:null, subiendo:false };
  render();
  showToast('Conexión guardada ✓');
}

async function hacerLogin(){
  const email = document.getElementById('sbEmail').value;
  const pass = document.getElementById('sbPass').value;
  if(!email || !pass){ showToast('Pon tu correo y tu contraseña'); return; }
  showToast('Entrando…');
  try{
    await sbLogin(email, pass);
    sync = { estado:'pend', mensaje:'Conectando…', ultima:null, subiendo:false };
    render();
    const ok = await syncNow(false);
    showToast(ok ? 'Conectado y sincronizado ✓' : 'Has entrado, pero falta sincronizar');
  }catch(e){
    showToast(e.message || 'No se pudo entrar');
  }
}

function copiarSQL(){
  try{
    if(navigator.clipboard){ navigator.clipboard.writeText(SQL_TABLAS).then(()=>showToast('SQL copiado ✓')); }
    else throw new Error();
  }catch(e){
    const w = window.open('', '_blank');
    if(w){ w.document.write('<pre style="white-space:pre-wrap;font:13px monospace;padding:16px">' + escapeHtml(SQL_TABLAS) + '</pre>'); }
    else showToast('No se pudo copiar');
  }
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------- eventos ---------- */
function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.onclick = (ev)=>{
      const action = el.dataset.action;
      if(action === 'open-income-form'){ ui.incomeMethod = el.dataset.method; render(); scrollTop(); }
      else if(action === 'close-income-form'){ ui.incomeMethod = null; render(); }
      else if(action === 'save-income'){ saveIncome(); }
      else if(action === 'del-income'){ deleteIncome(el.dataset.id); }
      else if(action === 'open-category'){ ui.selectedCategory = el.dataset.cat; ui.gastoView = 'detail'; ui.expenseCash = false; render(); scrollTop(); }
      else if(action === 'close-category'){ ui.gastoView = 'list'; ui.selectedCategory = null; render(); }
      else if(action === 'open-cash'){ ui.gastoView = 'cash'; render(); scrollTop(); }
      else if(action === 'close-cash'){ ui.gastoView = 'list'; render(); }
      else if(action === 'open-pending-expenses'){ ui.gastoView = 'pending'; render(); scrollTop(); }
      else if(action === 'close-pending-expenses'){ ui.gastoView = 'list'; render(); }
      else if(action === 'toggle-cash'){
        ui.expenseCash = !ui.expenseCash;
        el.classList.toggle('active', ui.expenseCash);
        el.style.background = ui.expenseCash ? 'var(--cash)' : 'var(--gray-pill)';
      }
      else if(action === 'save-expense'){ saveExpense(el.dataset.cat); }
      else if(action === 'del-expense'){ deleteExpense(el.dataset.id); }
      else if(action === 'add-category'){ addCategory(); }
      else if(action === 'export-data'){ exportData(); }
      else if(action === 'trend-range'){ ui.trendRange = el.dataset.value === 'mes' ? 'mes' : Number(el.dataset.value); render(); }
      else if(action === 'toggle-day'){ const d = el.dataset.date; ui.openDays[d] = !ui.openDays[d]; render(); }
      else if(action === 'toggle-group'){ const g = el.dataset.group; ui.openGroups[g] = !ui.openGroups[g]; render(); }
      else if(action === 'reconcile-group'){ reconcileGroup(el.dataset.group); }
      else if(action === 'import-data'){ importData(); }
      else if(action === 'toggle-reconciled'){ toggleReconciled(el.dataset.kind, el.dataset.id); }
      else if(action === 'toggle-pending-only'){
        const k = el.dataset.key;
        ui[k] = !ui[k];
        render();
      }
      else if(action === 'goto-tab'){ ui.tab = el.dataset.tab; render(); scrollTop(); }
      else if(action === 'save-cfg'){ guardarConfig(); }
      else if(action === 'do-login'){ hacerLogin(); }
      else if(action === 'do-logout'){ sbLogout(); render(); showToast('Sesión cerrada'); }
      else if(action === 'sync-now'){ syncNow(false).then(ok=>showToast(ok ? 'Sincronizado ✓' : 'No se pudo sincronizar')); }
      else if(action === 'copy-sql'){ copiarSQL(); }
      else if(action === 'retry-save'){
        el.textContent = 'Subiendo…';
        el.disabled = true;
        syncNow(false).then(ok=>{
          showToast(ok ? 'Subido ✓' : 'Sigue sin subir. Los datos están a salvo en este aparato.');
          render();
        });
      }
      else if(action === 'quick-date'){
        const targetEl = document.getElementById(el.dataset.target);
        if(targetEl){
          targetEl.value = el.dataset.value === 'ayer' ? (()=>{ const d=new Date(); d.setDate(d.getDate()-1); return toLocalISO(d); })() : todayISO();
        }
      }
      else if(action === 'filter-mode'){
        const k = el.dataset.key;
        ui[k] = { mode: el.dataset.mode };
        render();
      }
      else if(action === 'filter-range-toggle'){
        const k = el.dataset.key;
        const f = ui[k];
        if(f.mode === 'rango'){ ui[k] = { mode: 'hoy' }; }
        else { ui[k] = { mode: 'rango', from: f.from || todayISO(), to: f.to || todayISO() }; }
        render();
      }
    };
  });
  document.querySelectorAll('[data-role="filter-date"]').forEach(inp=>{
    inp.onchange = ()=>{
      const k = inp.dataset.key;
      if(!inp.value) return;
      ui[k] = { mode: 'fecha', date: inp.value };
      render();
    };
  });
  document.querySelectorAll('[data-role="filter-from"]').forEach(inp=>{
    inp.onchange = ()=>{
      const k = inp.dataset.key;
      ui[k] = { mode: 'rango', from: inp.value, to: (ui[k] && ui[k].to) || inp.value };
      render();
    };
  });
  document.querySelectorAll('[data-role="filter-to"]').forEach(inp=>{
    inp.onchange = ()=>{
      const k = inp.dataset.key;
      ui[k] = { mode: 'rango', from: (ui[k] && ui[k].from) || inp.value, to: inp.value };
      render();
    };
  });
  document.querySelectorAll('.date-tap').forEach(inp=>{
    inp.onclick = ()=>{ if(inp.showPicker){ try{ inp.showPicker(); }catch(e){} } };
  });
}

function scrollTop(){ document.getElementById('main').scrollTop = 0; window.scrollTo(0,0); }

async function saveIncome(){
  const amountEl = document.getElementById('incAmount');
  const dateEl = document.getElementById('incDate');
  const noteEl = document.getElementById('incNote');
  const amount = parseFloat(amountEl.value);
  if(!amount || amount <= 0){ showToast('Introduce un importe válido'); amountEl.focus(); return; }
  const entryDate = dateEl.value || todayISO();
  state.incomeEntries.push(touch({ id: uid(), date: entryDate, method: ui.incomeMethod, amount, note: (noteEl.value||'').trim(), reconciled: false }));
  ui.incomeMethod = null;
  ui.incomeFilter = entryDate === todayISO() ? { mode: 'hoy' } : { mode: 'fecha', date: entryDate };
  const ok = await saveState();
  render();
  showToast(ok ? `Ingreso añadido · ${fmtDateDow(entryDate)}` : 'Guardado en el dispositivo. Reintentando en la nube…');
}

async function toggleReconciled(kind, id){
  const list = kind === 'income' ? state.incomeEntries : state.expenseEntries;
  const entry = list.find(e=>e.id===id);
  if(!entry) return;
  entry.reconciled = !entry.reconciled;
  touch(entry);
  render();
  await saveState();
}

async function deleteIncome(id){
  addTombstone(id);
  state.incomeEntries = state.incomeEntries.filter(e=>e.id!==id);
  await saveState();
  render();
}

async function saveExpense(cat){
  const subEl = document.getElementById('expSub');
  const dateEl = document.getElementById('expDate');
  const amountEl = document.getElementById('expAmount');
  const noteEl = document.getElementById('expNote');
  const amount = parseFloat(amountEl.value);
  if(!amount || amount <= 0){ showToast('Introduce un importe válido'); amountEl.focus(); return; }
  const entryDate = dateEl.value || todayISO();
  const isCash = !!ui.expenseCash;
  state.expenseEntries.push(touch({ id: uid(), date: entryDate, category: cat, subcategory: (subEl.value||'').trim(), amount, note: (noteEl.value||'').trim(), cash: isCash, reconciled: false }));
  ui.expenseFilter = entryDate === todayISO() ? { mode: 'hoy' } : { mode: 'fecha', date: entryDate };
  // El listado de efectivo debe enseñar siempre el gasto recién apuntado,
  // aunque el filtro estuviera puesto en otro día.
  if(isCash && !inRange(entryDate, computeRange(ui.cashFilter))) ui.cashFilter = { mode: 'todo' };
  ui.expenseCash = false;
  const ok = await saveState();
  render();
  showToast(ok ? `Gasto añadido${isCash?' · 💵 efectivo':''} · ${fmtDateDow(entryDate)}` : 'Guardado en el dispositivo. Reintentando en la nube…');
}

async function deleteExpense(id){
  addTombstone(id);
  state.expenseEntries = state.expenseEntries.filter(e=>e.id!==id);
  await saveState();
  render();
}

async function addCategory(){
  const name = prompt('Nombre de la nueva categoría de gasto:');
  if(!name) return;
  const trimmed = name.trim();
  if(!trimmed) return;
  if(state.expenseCategories.some(c=>c.toLowerCase()===trimmed.toLowerCase())){ showToast('Esa categoría ya existe'); return; }
  state.expenseCategories.push(trimmed);
  await saveState();
  render();
}

/* ---------- tabs ---------- */
document.getElementById('tabs').addEventListener('click', (ev)=>{
  const btn = ev.target.closest('.nav-btn');
  if(!btn) return;
  ui.tab = btn.dataset.tab;
  if(ui.tab !== 'ajustes') ui.gastoView = 'list';
  ui.selectedCategory = null;
  ui.incomeMethod = null;
  render();
});

/* ---------- cabecera ---------- */
function paintHeaderDate(){
  const el = document.getElementById('todayPill');
  if(el) el.textContent = syncPillText();
}

/* ---------- init ---------- */
(async function init(){
  try{
    await loadState();
    paintHeaderDate();
    render();
  }catch(e){
    document.getElementById('main').innerHTML =
      '<div class="card"><div class="empty-note">No se pudo iniciar la app: ' + escapeHtml(e && e.message ? e.message : String(e)) + '</div></div>';
    console.error(e);
  }
})();

window.addEventListener('error', function(e){
  const main = document.getElementById('main');
  if(main && !main.innerHTML.trim()){
    main.innerHTML = '<div class="card"><div class="empty-note">Ha ocurrido un error cargando la app. Prueba a recargar.</div></div>';
  }
});
</script>
